<!-- @dsCard group="Motifs" viewport="700x150" subtitle="1.5px ink rule + numbered mono label, number in accent" name="Section header" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}</style></head>
<body>
<div style="padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:28px">
  <div>
    <div style="display:flex;align-items:baseline;gap:8px;border-top:var(--rule-w-strong) solid var(--rule-strong);padding-top:6px">
      <span style="font-family:var(--font-mono);font-size:var(--label-size);font-weight:500;color:var(--accent)">01</span>
      <span style="font-family:var(--font-mono);font-size:var(--label-size);font-weight:500;letter-spacing:var(--label-track);text-transform:uppercase">Experience</span>
    </div>
    <p style="margin:10px 0 0;font-size:13px;color:var(--ink-2)">Every section opens this way — print and web.</p>
  </div>
  <div>
    <div style="display:flex;align-items:baseline;gap:8px;border-top:var(--rule-w-strong) solid var(--rule-strong);padding-top:6px">
      <span style="font-family:var(--font-mono);font-size:var(--label-size);font-weight:500;color:var(--accent)">04</span>
      <span style="font-family:var(--font-mono);font-size:var(--label-size);font-weight:500;letter-spacing:var(--label-track);text-transform:uppercase">Selected Publications</span>
      <span style="flex:1"></span>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--ink-3)">full list → <a href="#" style="color:var(--link);text-decoration:none">Google Scholar</a></span>
    </div>
    <p style="margin:10px 0 0;font-size:13px;color:var(--ink-2)">With an optional mono aside pushed right.</p>
  </div>
</div>
</body></html>
