<!-- @dsCard group="Colors" viewport="700x160" subtitle="Warm paper + ink scale + rules (light)" name="Neutrals — light" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.sw{height:52px;border:1px solid var(--rule)}.c{display:flex;flex-direction:column;gap:5px}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:16px 20px">
  <div class="c"><div class="sw" style="background:var(--paper)"></div>--paper<br>#FAF9F7</div>
  <div class="c"><div class="sw" style="background:var(--surface)"></div>--surface<br>#FFFFFF</div>
  <div class="c"><div class="sw" style="background:var(--surface-sunken)"></div>--surface-sunken<br>#F3F1ED</div>
  <div class="c"><div class="sw" style="background:var(--ink);border:0"></div>--ink<br>#191613</div>
  <div class="c"><div class="sw" style="background:var(--ink-2);border:0"></div>--ink-2<br>#45403A</div>
  <div class="c"><div class="sw" style="background:var(--ink-3);border:0"></div>--ink-3<br>#6F6A62</div>
  <div class="c"><div class="sw" style="background:var(--ink-4);border:0"></div>--ink-4<br>#9C968D</div>
</div>
<div style="padding:0 20px 14px;display:flex;gap:24px;align-items:center">
  <span style="flex:1;border-top:var(--rule-w-strong) solid var(--rule-strong)"></span><span>--rule-strong 1.5px</span>
  <span style="flex:1;border-top:1px solid var(--rule)"></span><span>--rule</span>
  <span style="flex:1;border-top:1px solid var(--rule-faint)"></span><span>--rule-faint</span>
</div>
</body></html>
