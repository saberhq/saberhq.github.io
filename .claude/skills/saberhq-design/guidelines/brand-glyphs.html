<!doctype html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-mono)}
.g{font-size:22px;color:var(--accent)}.l{font-size:9.5px;color:var(--ink-4);margin-top:4px}</style></head>
<body>
<div style="padding:20px 24px;display:grid;grid-template-columns:repeat(7,1fr);gap:16px;text-align:center">
  <div><div class="g">—</div><div class="l">bullet</div></div>
  <div><div class="g">·</div><div class="l">separator</div></div>
  <div><div class="g">×</div><div class="l">AI × Bio</div></div>
  <div><div class="g">/</div><div class="l">path</div></div>
  <div><div class="g">→</div><div class="l">continue</div></div>
  <div><div class="g">↗</div><div class="l">external</div></div>
  <div><div class="g" style="font-size:15px;line-height:2">[Code]</div><div class="l">artifact link</div></div>
</div>
</body></html>
