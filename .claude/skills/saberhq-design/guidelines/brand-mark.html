<!-- @dsCard group="Brand" viewport="700x150" subtitle="Typographic only — never a drawn logo" name="The mark" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}</style></head>
<body>
<div style="padding:20px 24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-items:center">
  <div>
    <div style="font-family:var(--font-mono);font-size:15px;font-weight:500">saberhq.com</div>
    <div style="font-family:var(--font-mono);font-size:9.5px;color:var(--ink-4);margin-top:6px">primary mark · headers, corners</div>
  </div>
  <div>
    <div style="font-size:19px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase">Saber HQ</div>
    <div style="font-family:var(--font-mono);font-size:9.5px;color:var(--ink-4);margin-top:6px">wordmark · site title</div>
  </div>
  <div data-theme="dark" style="background:var(--paper);border-radius:var(--radius);padding:14px 16px">
    <div style="font-family:var(--font-mono);font-size:var(--micro-size);letter-spacing:var(--micro-track);color:var(--ink-4);display:flex;justify-content:space-between"><span style="color:var(--ink)">SABERHQ.COM</span><span>AI × BIO</span></div>
    <div style="font-family:var(--font-mono);font-size:9.5px;color:var(--ink-4);margin-top:8px">footer strip, on dark</div>
  </div>
</div>
</body></html>
