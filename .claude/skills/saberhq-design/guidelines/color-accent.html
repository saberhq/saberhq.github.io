<!-- @dsCard group="Colors" viewport="700x150" subtitle="Vermillion #D55E00 — the one accent, from Okabe–Ito" name="Accent" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}</style></head>
<body>
<div style="display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:10px;padding:16px 20px;height:118px">
  <div style="display:flex;flex-direction:column"><div style="flex:1;background:var(--accent)"></div><div style="margin-top:6px;color:var(--ink)">--accent · #D55E00</div><div>links · numbers · dashes</div></div>
  <div style="display:flex;flex-direction:column"><div style="flex:1;background:var(--accent-strong)"></div><div style="margin-top:6px">--accent-strong</div><div>#B34F00 · pressed</div></div>
  <div style="display:flex;flex-direction:column"><div style="flex:1;background:var(--accent-wash);border:1px solid var(--rule)"></div><div style="margin-top:6px">--accent-wash</div><div>#F7E9DE · code bg only</div></div>
  <div data-theme="dark" style="display:flex;flex-direction:column"><div style="flex:1;background:#16130F;display:flex;align-items:center;justify-content:center"><span style="background:var(--accent);width:56%;height:46%"></span></div><div style="margin-top:6px">dark: #F08A3E</div><div>lifted for contrast</div></div>
</div>
</body></html>
