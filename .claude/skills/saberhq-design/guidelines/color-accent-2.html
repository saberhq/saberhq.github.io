<!-- @dsCard group="Colors" viewport="700x150" subtitle="Carmine #A62B4D — the companion accent, spent on one named thing" name="Accent 2" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}</style></head>
<body>
<div style="display:grid;grid-template-columns:1.6fr 1fr 1.4fr 1.2fr;gap:10px;padding:16px 20px;height:118px">
  <div style="display:flex;flex-direction:column"><div style="flex:1;background:var(--accent-2)"></div><div style="margin-top:6px;color:var(--ink)">--accent-2 · #A62B4D</div><div>names one thing · never a fill</div></div>
  <div style="display:flex;flex-direction:column"><div style="flex:1;background:var(--accent-2-wash);border:1px solid var(--rule)"></div><div style="margin-top:6px">--accent-2-wash</div><div>#F7E4EA · hairline bg only</div></div>
  <div style="display:flex;flex-direction:column"><div style="flex:1;display:flex;align-items:center;gap:14px;border:1px solid var(--rule);padding:0 12px"><span style="color:var(--accent)">vermillion</span><span style="color:var(--accent-2)">carmine</span></div><div style="margin-top:6px">ΔE 17 in OKLab</div><div>16.4 / 17.9 deutan / protan</div></div>
  <div data-theme="dark" style="display:flex;flex-direction:column"><div style="flex:1;background:#16130F;display:flex;align-items:center;justify-content:center"><span style="background:var(--accent-2);width:56%;height:46%"></span></div><div style="margin-top:6px">dark: #DE5A78</div><div>lifted for contrast</div></div>
</div>
</body></html>
