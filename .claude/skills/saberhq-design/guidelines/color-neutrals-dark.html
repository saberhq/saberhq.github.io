<!-- @dsCard group="Colors" viewport="700x160" subtitle="Warm dark theme — data-theme=&quot;dark&quot;" name="Neutrals — dark" -->
<!doctype html><html data-theme="dark"><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.sw{height:52px;border:1px solid var(--rule)}.c{display:flex;flex-direction:column;gap:5px}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:16px 20px">
  <div class="c"><div class="sw" style="background:var(--paper)"></div>--paper<br>#16130F</div>
  <div class="c"><div class="sw" style="background:var(--surface)"></div>--surface<br>#1E1A15</div>
  <div class="c"><div class="sw" style="background:var(--surface-sunken)"></div>--surface-sunken<br>#110E0B</div>
  <div class="c"><div class="sw" style="background:var(--ink)"></div>--ink<br>#ECE7DF</div>
  <div class="c"><div class="sw" style="background:var(--ink-2)"></div>--ink-2<br>#C9C3B9</div>
  <div class="c"><div class="sw" style="background:var(--ink-3)"></div>--ink-3<br>#999183</div>
  <div class="c"><div class="sw" style="background:var(--accent)"></div>--accent<br>#F08A3E</div>
</div>
<div style="padding:0 20px 14px;font-family:var(--font-sans);font-size:13px;color:var(--ink)">
  Body text on warm dark paper, with a <a href="#" style="color:var(--link);text-decoration:none">vermillion link</a> and <span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-3)">mono metadata — Sep 2025</span>
</div>
</body></html>
