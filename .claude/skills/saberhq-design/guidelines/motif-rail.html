<!-- @dsCard group="Motifs" viewport="700x180" subtitle="Mono meta column left (140px), content right" name="The rail" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}</style></head>
<body>
<div style="padding:20px 24px;display:grid;grid-template-columns:var(--rail-col) 1fr;gap:12px var(--rail-gap)">
  <div style="font-family:var(--font-mono);font-size:var(--meta-size);line-height:1.5;padding-top:2px">
    <div>Sep 2025 — Aug 2026</div>
    <div style="color:var(--ink-3)">1 year</div>
    <div style="color:var(--ink-3);margin-top:4px">South San Francisco, CA</div>
  </div>
  <div>
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      <span style="font-size:var(--h3-size);font-weight:600;letter-spacing:var(--h3-track)">Computational Scientist</span>
      <span style="font-family:var(--font-mono);font-size:var(--meta-size);color:var(--ink-3)">Contract</span>
      <span style="flex:1;height:1px;background:var(--rule);min-width:10px"></span>
      <span style="font-size:14px;font-weight:500;color:var(--accent)">Genentech (gRED)</span>
    </div>
    <ul style="margin:7px 0 0;padding-left:14px;list-style:none;font-size:var(--small-size);line-height:1.55">
      <li style="position:relative;text-wrap:pretty"><span style="position:absolute;left:-14px;color:var(--accent)">—</span>Leader line connects title ↔ affiliation; em-dash bullets carry the accent.</li>
    </ul>
  </div>
</div>
</body></html>
