<!-- @dsCard group="Data Viz" viewport="700x150" subtitle="Okabe–Ito, colorblind-safe, charts only — vermillion leads" name="Chart palette" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3)}
.c{display:flex;flex-direction:column;gap:5px}.sw{height:56px}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:16px 20px">
  <div class="c"><div class="sw" style="background:var(--viz-1)"></div><span style="color:var(--ink)">--viz-1</span>#D55E00<br>vermillion</div>
  <div class="c"><div class="sw" style="background:var(--viz-2)"></div>--viz-2<br>#0072B2<br>blue</div>
  <div class="c"><div class="sw" style="background:var(--viz-3)"></div>--viz-3<br>#009E73<br>green</div>
  <div class="c"><div class="sw" style="background:var(--viz-4)"></div>--viz-4<br>#CC79A7<br>purple</div>
  <div class="c"><div class="sw" style="background:var(--viz-5)"></div>--viz-5<br>#56B4E9<br>sky</div>
  <div class="c"><div class="sw" style="background:var(--viz-6)"></div>--viz-6<br>#E69F00<br>orange</div>
  <div class="c"><div class="sw" style="background:var(--viz-7)"></div>--viz-7<br>#F0E442<br>yellow</div>
  <div class="c"><div class="sw" style="background:var(--viz-8)"></div>--viz-8<br>#999999<br>grey</div>
</div>
</body></html>
