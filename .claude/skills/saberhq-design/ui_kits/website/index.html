<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saber HQ — home</title>
<link rel="stylesheet" href="../../styles.css">
<style>

const { Button, Tag, Card, SectionHeader } = window.SaberHQCore;
const mono = (s, extra) => Object.assign({ fontFamily: 'var(--font-mono)', fontSize: s }, extra);

];
const news = [

  ['Jul 2025', 'Joined Genentech as a Computational Scientist.'],
  ['Jun 2025', 'Attended ICML in Vancouver.'],
  ['Dec 2024', 'Attended NeurIPS in Vancouver.'],
  ['Jul 2024', 'Defended my PhD dissertation and graduated from UBC.'],
  ['Jun 2024', 'The LRGASP research is published in Nature Methods.'],
];

          h('a', { href: 'https://x.com/saberhq' }, 'X')

        h('span', { style: { color: 'var(--accent)' } }, 'AI × BIO'), ' — RESEARCH, NOTES, AND PROJECTS'),

      h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginTop: 20 } },
        posts.map((p, i) => h(Card, { key: i, href: '#', meta: p.date + ' · BLOG', title: p.title },
          h('p', { style: { margin: 0, fontSize: '12.5px', color: 'var(--ink-2)', lineHeight: 1.5 } }, p.desc),

      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 20 } },

        h(Card, { title: 'The Attention — newsletter' },
          h('p', { style: { margin: '0 0 12px', fontSize: '13px', color: 'var(--ink-2)', lineHeight: 1.55 } }, 'Occasional roundups on research, projects, and ideas worth sharing. Practical, concise, and human.'),
          h(Button, { variant: 'secondary', size: 'sm', href: '#' }, 'Read the newsletter')
        )
      )
    ),
    h('section', { style: Object.assign({}, max, { paddingBottom: 64 }) },
      h(SectionHeader, { number: '03', label: 'About & recent news' }),
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 32, marginTop: 20 } },
        h('div', null,
          h('p', { style: { margin: 0, fontSize: 'var(--body-size)', lineHeight: 'var(--body-leading)', textWrap: 'pretty' } },
            "My name is Saber. I'm a Research Scientist with 12+ years of experience in genomics, data science, and machine learning. I earned my Ph.D. in Bioinformatics at ",
            h('a', { href: '#' }, 'UBC'),
            ', working on computational tools for next-generation sequencing. I am passionate about contributing to the understanding, controlling, and training of foundation models for biology.'),
          h('div', { style: { display: 'flex', gap: 6, marginTop: 14, flexWrap: 'wrap' } },
            h(Tag, null, 'Perturb-seq'), h(Tag, null, 'representation learning'), h(Tag, null, 'long-read RNA-seq'), h(Tag, { accent: true }, 'Virtual Cell Challenge'))
        ),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'auto 1fr', gap: '7px 14px', alignContent: 'start' } },
          news.flatMap((n, i) => [
            h('span', { key: 'd' + i, style: mono('var(--meta-size)', { fontWeight: 500, whiteSpace: 'nowrap' }) }, n[0]),
