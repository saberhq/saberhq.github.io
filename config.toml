baseURL = "https://saberhq.github.io/"
languageCode = "en-us"
title = "Saber HQ"
theme = "book"
enableRobotsTXT = true

[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[params]
  BookTheme = "auto"
  BookToC = true
  BookSection = "menu"
  BookDateFormat = "2006-01-02"
  BookRepo = "https://github.com/saberhq/saberhq.github.io"

# Top navigation
[menu]
  # Links shown on landing page header (Book's landing layout uses menu.home)
  [[menu.home]]
  name = "GitHub"
  url = "https://github.com/saberhq"
  weight = 10

  [[menu.home]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/saberhq"
    weight = 20

  [[menu.home]]
    name = "Google Scholar"
    url = "https://scholar.google.com/citations?user=q2fsO2IAAAAJ&hl=en"
    weight = 30

  [[menu.home]]
    name = "YouTube"
    url = "https://www.youtube.com/@saberhq"
    weight = 40

  [[menu.home]]
    name = "X"
    url = "https://x.com/saberhq"
    weight = 50

# Footer socials (optional)
[params.social]
  github = "https://github.com/saberhq"
  youtube = "https://www.youtube.com/@saberhq"
  linkedin = "https://www.linkedin.com/in/saberhq"
  twitter = "https://x.com/saberhq"