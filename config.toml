baseURL = "https://saberhq.com/"
languageCode = "en-us"
title = "Saber HQ"
theme = "book"
enableRobotsTXT = true
copyright = "© 2025–2026 Saber Hafezqorani · CC BY 4.0"
publishDir = "build"
# Tags are card chips and future organization, not pages (yet): keep Hugo from
# generating unstyled /tags/... listings until we design them.
disableKinds = ["taxonomy", "term"]

[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  style = "github"
  lineNumbers = false

[params]
  author = "Saber Hafezqorani"
  BookTheme = "auto"
  BookToC = true
  BookSection = "docs"
  BookDateFormat = "2006-01-02"
  BookRepo = "https://github.com/saberhq/saberhq.github.io"
  # saberhq.com pages that open in a new tab (links to other sites always do)
  newTab = ["/resume/"]

# The header's sections, left to right by weight.
# accent = true: carmine (Sidechain only); accent = "vibes": blue hour (Saber Vibes only).
[menu]
  [[menu.header]]
    name = "Sidechain"
    url = "/sidechain/"
    weight = 10
    [menu.header.params]
      accent = true

  [[menu.header]]
    name = "Saber Vibes"
    url = "/vibes/"
    weight = 20
    [menu.header.params]
      accent = "vibes"

  [[menu.header]]
    name = "Blog"
    url = "/blog/"
    weight = 30

  [[menu.header]]
    name = "About"
    url = "/about/"
    weight = 40

  # The footer's "Elsewhere" column: Saber on other sites, left to right by weight.
  [[menu.elsewhere]]
    name = "GitHub"
    url = "https://github.com/saberhq"
    weight = 10

  [[menu.elsewhere]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/saberhq"
    weight = 20

  [[menu.elsewhere]]
    name = "Scholar"
    url = "https://scholar.google.com/citations?user=q2fsO2IAAAAJ&hl=en"
    weight = 30

  [[menu.elsewhere]]
    name = "YouTube"
    url = "https://www.youtube.com/@saberhq"
    weight = 40

  [[menu.elsewhere]]
    name = "X"
    url = "https://x.com/saberhq"
    weight = 50

# Footer socials (optional)
[params.social]
  github = "https://github.com/saberhq"
  youtube = "https://www.youtube.com/@saberhq"
  linkedin = "https://www.linkedin.com/in/saberhq"
  twitter = "https://x.com/saberhq"

# Bottom permanent links in left menu
[[menu.after]]
  name = "Contact me"
  url = "mailto:saber.hafezqorani@gmail.com"
  weight = 10

[[menu.after]]
  name = "GitHub"
  url = "https://github.com/saberhq/saberhq.github.io"
  weight = 20

[caches.getresource]
  maxAge = "1h"
