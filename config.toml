baseURL = "https://saberh.com/"
languageCode = "en-us"
title = "Saber HQ"
theme = "book"
enableRobotsTXT = true
copyright = "© 2025–2026 Saber Hafezqorani · CC BY 4.0"
publishDir = "build"
# Tags are card chips and future organization, not pages (yet): keep Hugo from
# generating unstyled /tags/... listings until we design them.
disableKinds = ["taxonomy", "term"]

[permalinks.page]
  songs = "/vibes/songs/:contentbasename/"

[outputs]
  home = ["html", "rss", "llms", "markdown"]

# /llms.txt: the site map for AI tools (llmstxt.org)
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# index.md beside index.html: each page as plain text, for AI tools and readers
[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  style = "github"
  lineNumbers = false

[params]
  author = "Saber Hafezqorani"
  BookTheme = "auto"
  BookToC = true
  BookSection = "docs"
  BookDateFormat = "2006-01-02"
  BookRepo = "https://github.com/saberhq/saberhq.github.io"
  # a post's "updated" date links here, its file path added
  contentHistory = "https://github.com/saberhq/saberhq.github.io/commits/main/content/"
  # saberh.com pages that open in a new tab (links to other sites always do)
  newTab = []

# Footer socials (optional)
[params.social]
  github = "https://github.com/saberhq"
  youtube = "https://www.youtube.com/@saberhq"
  linkedin = "https://www.linkedin.com/in/saberhq"
  twitter = "https://x.com/saberhq"

# Bottom permanent links in left menu
[[menu.after]]
  name = "Contact me"
  url = "mailto:saber.hafezqorani@gmail.com"
  weight = 10

[[menu.after]]
  name = "GitHub"
  url = "https://github.com/saberhq/saberhq.github.io"
  weight = 20

[caches.getresource]
  maxAge = "1h"
