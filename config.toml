baseURL = "https://saberhq.com/"
languageCode = "en-us"
title = "Saber HQ"
theme = "book"
enableRobotsTXT = true
# Tags are card chips and future organization, not pages (yet): keep Hugo from
# generating unstyled /tags/... listings until we design them.
disableKinds = ["taxonomy", "term"]

[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  style = "github"
  lineNumbers = false

[params]
  author = "Saber Hafezqorani"
  BookTheme = "auto"
  BookToC = true
  BookSection = "docs"
  BookDateFormat = "2006-01-02"
  BookRepo = "https://github.com/saberhq/saberhq.github.io"

# Top navigation
[menu]
  # Links shown on landing page header (Book's landing layout uses menu.home).
  # accent = true draws the entry in carmine (--accent-2) — Sidechain only.
  [[menu.home]]
    name = "Sidechain"
    url = "/sidechain/"
    weight = 5
    [menu.home.params]
      accent = true

  [[menu.home]]
  name = "GitHub"
  url = "https://github.com/saberhq"
  weight = 10

  [[menu.home]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/saberhq"
    weight = 20

  [[menu.home]]
    name = "Scholar"
    url = "https://scholar.google.com/citations?user=q2fsO2IAAAAJ&hl=en"
    weight = 30

  [[menu.home]]
    name = "YouTube"
    url = "https://www.youtube.com/@saberhq"
    weight = 40

  [[menu.home]]
    name = "X"
    url = "https://x.com/saberhq"
    weight = 50

# Footer socials (optional)
[params.social]
  github = "https://github.com/saberhq"
  youtube = "https://www.youtube.com/@saberhq"
  linkedin = "https://www.linkedin.com/in/saberhq"
  twitter = "https://x.com/saberhq"

# Bottom permanent links in left menu
[[menu.after]]
  name = "Contact me"
  url = "mailto:saber.hafezqorani@gmail.com"
  weight = 10

[[menu.after]]
  name = "GitHub"
  url = "https://github.com/saberhq/saberhq.github.io"
  weight = 20
