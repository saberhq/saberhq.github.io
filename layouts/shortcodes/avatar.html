{{/*
  avatar shortcode
  Usage: {{< avatar src="/saberhq_profile.jpeg" alt="Portrait" size="160" >}}
*/}}
{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "" }}
{{ $size := .Get "size" | default "160" }}
<img
  src="{{ $src }}"
  alt="{{ $alt }}"
  style="width: {{ $size }}px; height: {{ $size }}px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 1rem;"
  loading="lazy"
  decoding="async"
>
