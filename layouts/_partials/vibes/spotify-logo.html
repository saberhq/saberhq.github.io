{{- /* Spotify attribution for /vibes/: the official logo, unmodified. Context: dict "href". */ -}}
{{- $black := resources.Get "vibes/Full_Logo_Black_RGB.svg" | resources.Fingerprint }}
{{- $white := resources.Get "vibes/Full_Logo_White_RGB.svg" | resources.Fingerprint }}
<a class="vb-spotify" href="{{ .href }}" target="_blank" rel="noopener" aria-label="Spotify — the playlist on Spotify (opens in a new tab)">
  <img class="vb-spotify-light" src="{{ $black.RelPermalink }}" width="76" height="21" alt="">
  <img class="vb-spotify-dark" src="{{ $white.RelPermalink }}" width="76" height="21" alt="">
</a>
