{{/* Saber HQ theme toggle — any element with data-theme-toggle flips light/dark, persists
     the choice, and keeps the browser-chrome color in sync (values mirror --paper). */}}
<script>
document.addEventListener('click', function (e) {
  var btn = e.target.closest('[data-theme-toggle]');
  if (!btn) return;
  var root = document.documentElement;
  var toDark = root.getAttribute('data-theme') !== 'dark';
  if (toDark) { root.setAttribute('data-theme', 'dark'); } else { root.removeAttribute('data-theme'); }
  document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
    m.removeAttribute('media');
    m.setAttribute('content', toDark ? '#16130F' : '#FAF9F7');
  });
  try { localStorage.setItem('saberhq-theme', toDark ? 'dark' : 'light'); } catch (err) {}
});
</script>
