{{ partial "saberhq/site-scripts" . }}
{{/* GoatCounter pageviews; production only. */}}
{{ if hugo.IsProduction }}
<script data-goatcounter="https://saberhq.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
{{ end }}

{{/* Outbound clicks, grouped by host (email links as out/email); same-host links are skipped. */}}
{{ if hugo.IsProduction }}
<script>
document.addEventListener('click', function (e) {
  var a = e.target && e.target.closest && e.target.closest('a[href^="http"], a[href^="mailto:"]');
  if (!a) return;
  var mail = a.protocol === 'mailto:';
  var host = mail ? 'email' : a.host.replace(/^www\./, '');
  if (host === location.host.replace(/^www\./, '')) return;
  if (!window.goatcounter || !window.goatcounter.count) return;
  window.goatcounter.count({ path: 'out/' + host, title: mail ? 'Email' : a.href, event: true });
});
</script>
{{ end }}
