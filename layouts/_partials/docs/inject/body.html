{{/* The theme switch: any element with data-theme-toggle flips light/dark and keeps the choice. */}}
<script>
(function () {
  var root = document.documentElement;
  function mark() {
    var dark = root.getAttribute('data-theme') === 'dark';
    document.querySelectorAll('[data-theme-toggle][role="switch"]').forEach(function (b) {
      b.setAttribute('aria-checked', dark ? 'true' : 'false');
    });
  }
  mark();
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-theme-toggle]');
    if (!btn) return;
    var toDark = root.getAttribute('data-theme') !== 'dark';
    if (toDark) { root.setAttribute('data-theme', 'dark'); } else { root.removeAttribute('data-theme'); }
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
      m.removeAttribute('media');
      m.setAttribute('content', toDark ? '#16130F' : '#FAF9F7');
    });
    try { localStorage.setItem('saberhq-theme', toDark ? 'dark' : 'light'); } catch (err) {}
    mark();
  });
})();
</script>

{{/* GoatCounter pageviews; production only. */}}
{{ if hugo.IsProduction }}
<script data-goatcounter="https://saberhq.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
{{ end }}

{{/* Outbound clicks, grouped by host; same-host links are skipped. */}}
{{ if hugo.IsProduction }}
<script>
document.addEventListener('click', function (e) {
  var a = e.target && e.target.closest && e.target.closest('a[href^="http"]');
  if (!a) return;
  var host = a.host.replace(/^www\./, '');
  if (host === location.host.replace(/^www\./, '')) return;
  if (!window.goatcounter || !window.goatcounter.count) return;
  window.goatcounter.count({ path: 'out/' + host, title: a.href, event: true });
});
</script>
{{ end }}
