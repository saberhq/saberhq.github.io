{{/* End-of-article actions: back to top + minimal share actions.
     Share/copy only pass the page URL along for now — richer behavior TBD. */}}
<div class="sq-post-actions">
  <button class="sq-action" type="button" data-scroll-top>↑ Back to top</button>
  <span class="sq-fill"></span>
  <button class="sq-action" type="button" data-share data-url="{{ .Permalink }}" data-title="{{ .Title }}">Share ↗</button>
  <button class="sq-action" type="button" data-copy-link data-url="{{ .Permalink }}">Copy link</button>
</div>
<script>
(function () {
  var top = document.querySelector('[data-scroll-top]');
  if (top) top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  function copyTo(btn, url) {
    var done = function () {
      var was = btn.textContent;
      btn.textContent = 'Link copied';
      setTimeout(function () { btn.textContent = was; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(function () { window.prompt('Copy this link:', url); });
    } else {
      window.prompt('Copy this link:', url);
    }
  }

  var share = document.querySelector('[data-share]');
  if (share) share.addEventListener('click', function () {
    var url = share.getAttribute('data-url');
    if (navigator.share) {
      navigator.share({ title: share.getAttribute('data-title'), url: url }).catch(function () {});
    } else {
      copyTo(share, url);
    }
  });

  var copyBtn = document.querySelector('[data-copy-link]');
  if (copyBtn) copyBtn.addEventListener('click', function () { copyTo(copyBtn, copyBtn.getAttribute('data-url')); });
})();
</script>
