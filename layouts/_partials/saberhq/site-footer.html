{{/* Saber HQ micro footer strip — same on every page.
     Context: dict "page" . plus optional "crumb" (dict "label" "href") for the left trail. */}}
{{ $p := .page }}
<footer class="sq-sitefooter">
  <div class="sq-wrap sq-sitefooter-in">
    <span><a href="{{ $p.Site.Home.RelPermalink }}">SABERHQ.COM</a>{{ with .crumb }} <span class="sq-dash">—</span> <a href="{{ .href }}">{{ .label }}</a>{{ end }}</span>
    <span>© {{ now.Format "2006" }} SABER HAFEZQORANI</span>
  </div>
</footer>
